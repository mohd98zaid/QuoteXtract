server {
    listen 11434;

    # Forward all requests to Docker Model Runner
    location / {
        proxy_pass http://model-runner.docker.internal;
        proxy_http_version 1.1;
        proxy_set_header Host model-runner.docker.internal;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # Allow large requests (PDF text payloads)
        client_max_body_size 50m;
    }
}
