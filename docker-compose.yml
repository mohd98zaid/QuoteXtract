services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotextract
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotextract"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/quotextract
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # Local LLM via llm-proxy container
      LOCAL_AI_BASE_URL: http://host.docker.internal:11434/engines/llama.cpp/v1
      LOCAL_AI_API_KEY: local
      LOCAL_AI_MODEL: hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:q4_k_m
      # IMAP settings (optional — leave blank to disable email polling)

      IMAP_HOST: ${IMAP_HOST:-imap.hostinger.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_EMAIL: ${IMAP_EMAIL:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_POLL_INTERVAL: ${IMAP_POLL_INTERVAL:-60}
      # SMTP settings (optional — for sending emails)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pdf_storage:/tmp/quotation-pdfs

  # Proxy that runs on the default bridge where model-runner.docker.internal resolves correctly
  llm-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./docker/nginx-llm-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    network_mode: "bridge"

  dashboard:
    build:
      context: .
      dockerfile: artifacts/quotation-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-server

networks:
  default:

volumes:
  postgres_data:
  pdf_storage:
