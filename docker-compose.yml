services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotextract
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotextract"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/quotextract
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # Local LLM via Docker Model Runner
      # Run first: docker model run hf.co/unsloth/Qwen3.5-0.8B-GGUF:Q4_K_M
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://model-runner.docker.internal/engines/llama.cpp/v1
      AI_INTEGRATIONS_OPENAI_API_KEY: local
      OPENAI_MODEL: hf.co/unsloth/Qwen3.5-0.8B-GGUF:Q4_K_M
      # IMAP settings (optional — leave blank to disable email polling)
      IMAP_HOST: ${IMAP_HOST:-imap.hostinger.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_EMAIL: ${IMAP_EMAIL:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_POLL_INTERVAL: ${IMAP_POLL_INTERVAL:-60}
      # SMTP settings (optional — for sending emails)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "model-runner.docker.internal:host-gateway"
    volumes:
      - pdf_storage:/tmp/quotation-pdfs

  dashboard:
    build:
      context: .
      dockerfile: artifacts/quotation-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-server

volumes:
  postgres_data:
  pdf_storage:
